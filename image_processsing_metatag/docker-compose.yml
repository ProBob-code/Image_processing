version: "3"
services:
  content_processing_bob_final:
    image: "content_processing_bob_final"
    #pull_policy: always
    build: .
    container_name: content_processing_bob_final
    restart: on-failure
    privileged: true
    network_mode: bridge
    # environment:
    #  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    ports:
    #  - "3080:8080"
      # - "4080:4081"
      - "4050:4051"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /etc/resolv.conf:/etc/resolv.conf:rw
      - /home/bobjacob/sandbox/content_processing/dags:/opt/airflow/dags:rw
      - /home/bobjacob/sandbox/content_processing/logs:/opt/airflow/logs:rw
      - /home/bobjacob/sandbox/content_processing/api:/opt/airflow/api:rw
      - /home/bobjacob/sandbox/content_processing/models:/opt/airflow/models:rw
      - /var/log/images/video_input:/var/log/images/video_input:rw
      - /var/log/images/video_output:/var/log/images/video_output:rw

    tty: true

